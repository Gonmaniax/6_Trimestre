<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="app.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@200..700&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Este es mi primer Angularr</h1>
    <h2>Bienvenidos ADSO</h2>
    <h2>Bienvenido {{bienvenido}}</h2>
    <ul>
        <li>Cuadernos</li>
        <li>Gafas</li>
        <li>Gorras</li>
    </ul>
    <h2>Sintaxis Antigua</h2>
    <ul>
        <li *ngFor="let objeto of Estuduantes">{{objeto}}</li>
    </ul>
    <h2>Sintaxis Nueva</h2>
    <ul>
        @for(objeto of Estuduantes; track objeto){
            <li>{{objeto}}</li>
        }
    </ul>
</body>
</html>
